name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build e testes
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restaurar dependências
        run: dotnet restore AgroConecta.sln

      - name: Compilar
        run: dotnet build AgroConecta.sln --no-restore --configuration Release

      - name: Executar testes
        run: dotnet test AgroConecta.sln --no-build --configuration Release --logger "trx;LogFileName=resultados.trx"

      - name: Publicar resultados dos testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-testes
          path: "**/TestResults/*.trx"

  docker:
    name: Imagem Docker
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build da imagem
        run: docker build -t agroconecta-web:${{ github.sha }} .
