services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: agroconecta-db
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:-AgroConecta@2026}"
    ports:
      - "1433:1433"
    volumes:
      - agroconecta-dados:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' -b -o /dev/null || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  web:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: agroconecta-web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Ambiente de demonstração: aplica migrations e seed automaticamente.
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Default: "Server=db,1433;Database=AgroConecta;User Id=sa;Password=${MSSQL_SA_PASSWORD:-AgroConecta@2026};TrustServerCertificate=True;Encrypt=False"
      Jwt__Chave: "${JWT_CHAVE:-dev-chave-simetrica-agroconecta-2026-altere-em-producao}"
    ports:
      - "8080:8080"
    volumes:
      - agroconecta-uploads:/app/wwwroot/uploads

volumes:
  agroconecta-dados:
  agroconecta-uploads:
